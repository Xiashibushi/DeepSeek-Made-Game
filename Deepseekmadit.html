<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小镇物语 · Little Town</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#243b4a;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    user-select:none}
  #game{display:block;position:fixed;inset:0;touch-action:none;cursor:pointer}

  /* ---------- 顶部资源栏 ---------- */
  #hud{
    position:fixed;left:50%;top:12px;transform:translateX(-50%);
    display:flex;gap:6px;padding:7px 10px;border-radius:14px;
    background:rgba(20,32,42,.82);backdrop-filter:blur(14px);
    border:1px solid rgba(150,210,235,.16);
    box-shadow:0 8px 28px rgba(0,0,0,.4);
    z-index:10;white-space:nowrap;
  }
  .res{display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:9px;
    background:rgba(255,255,255,.05);font-size:14px;color:#dff0fa;font-weight:600;
    font-variant-numeric:tabular-nums;transition:transform .15s,background .15s}
  .res .ic{font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .res.bump{transform:scale(1.14);background:rgba(255,215,94,.16)}

  /* ---------- 底部提示 ---------- */
  #tip{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
    padding:9px 20px;border-radius:11px;font-size:12.5px;color:rgba(200,225,240,.72);
    background:rgba(20,32,42,.8);backdrop-filter:blur(10px);
    border:1px solid rgba(150,210,235,.12);z-index:10;
    text-align:center;max-width:min(88vw,520px);line-height:1.55;
    transition:opacity .4s;
  }
  #tip b{color:#7de3c4;font-weight:600}

  /* ---------- 右侧按钮 ---------- */
  #sideBtns{
    position:fixed;right:12px;bottom:78px;display:flex;flex-direction:column;gap:7px;z-index:20;
  }
  .tbtn{
    width:44px;height:44px;border-radius:13px;cursor:pointer;font-size:19px;
    border:1px solid rgba(150,210,235,.16);
    background:rgba(20,32,42,.86);backdrop-filter:blur(14px);
    color:#dff0fa;transition:.15s;position:relative;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .tbtn:hover{background:rgba(38,58,74,.95);border-color:rgba(150,210,235,.4);transform:translateY(-1px)}
  .tbtn:active{transform:scale(.94)}
  .tbtn .dot{
    position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;
    background:#e85a7a;color:#fff;font-size:10px;font-weight:700;line-height:17px;
    text-align:center;padding:0 4px;box-shadow:0 2px 6px rgba(0,0,0,.4);
    display:none;
  }
  .tbtn .dot.show{display:block}

  /* ---------- 建造菜单 ---------- */
  #buildMenu{
    position:fixed;z-index:30;width:268px;padding:10px;
    border-radius:15px;background:rgba(18,29,38,.95);backdrop-filter:blur(18px);
    border:1px solid rgba(150,210,235,.2);
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transform:scale(.94) translateY(6px);
    transform-origin:center;transition:opacity .16s,transform .16s;
  }
  #buildMenu.show{opacity:1;pointer-events:auto;transform:scale(1) translateY(0)}
  #buildMenu .bm-head{display:flex;justify-content:space-between;align-items:center;
    padding:2px 6px 9px;font-size:12px;color:rgba(180,210,228,.65);letter-spacing:.05em}
  #buildMenu .bm-close{cursor:pointer;font-size:16px;color:rgba(180,210,228,.6);
    padding:0 4px;line-height:1;transition:color .15s}
  #buildMenu .bm-close:hover{color:#ff8a8a}
  .bcard{
    display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;
    cursor:pointer;transition:background .13s,transform .1s;
    border:1px solid transparent;
  }
  .bcard:hover{background:rgba(255,255,255,.06);border-color:rgba(150,210,235,.18)}
  .bcard:active{transform:scale(.97)}
  .bcard.locked{opacity:.42;cursor:not-allowed}
  .bcard.locked:hover{background:rgba(255,80,80,.06);border-color:rgba(255,120,120,.2)}
  .bcard .bic{font-size:22px;width:32px;text-align:center;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .bcard .binfo{flex:1;min-width:0}
  .bcard .bname{font-size:13.5px;color:#e6f3fb;font-weight:600}
  .bcard .bdesc{font-size:11px;color:rgba(160,195,215,.65);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bcard .bcost{font-size:11.5px;color:#ffd75e;font-weight:600;
    text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .bcard .bcost .no{color:#ff7d7d}

  /* ---------- 管理面板 ---------- */
  #managePanel{
    position:fixed;right:0;top:0;bottom:0;width:352px;max-width:90vw;
    background:rgba(15,24,32,.97);backdrop-filter:blur(22px);
    border-left:1px solid rgba(150,210,235,.16);
    box-shadow:-16px 0 48px rgba(0,0,0,.55);
    transform:translateX(102%);transition:transform .3s cubic-bezier(.22,1,.36,1);
    z-index:40;display:flex;flex-direction:column;
    pointer-events:none;
  }
  #managePanel.show{transform:translateX(0);pointer-events:auto}
  .mp-head{display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 12px;font-size:15px;font-weight:700;color:#e6f3fb;
    border-bottom:1px solid rgba(150,210,235,.1)}
  .mp-head .mp-close{cursor:pointer;font-size:17px;color:rgba(180,210,228,.6);
    padding:2px 6px;border-radius:7px;transition:.15s}
  .mp-head .mp-close:hover{color:#ff8a8a;background:rgba(255,120,120,.1)}
  .mp-tabs{display:flex;gap:4px;padding:10px 14px 4px}
  .mp-tabs button{
    flex:1;font:inherit;font-size:12.5px;padding:8px 4px;border-radius:9px;cursor:pointer;
    background:transparent;border:1px solid transparent;color:rgba(170,200,220,.7);
    transition:.15s;
  }
  .mp-tabs button:hover{background:rgba(255,255,255,.05);color:#dff0fa}
  .mp-tabs button.active{background:rgba(125,227,196,.14);border-color:rgba(125,227,196,.4);color:#7de3c4;font-weight:600}
  #mpBody{flex:1;overflow-y:auto;padding:12px 14px 22px;scrollbar-width:thin}
  #mpBody::-webkit-scrollbar{width:6px}
  #mpBody::-webkit-scrollbar-thumb{background:rgba(150,210,235,.2);border-radius:3px}

  .mp-sec-title{font-size:11px;letter-spacing:.08em;color:rgba(160,195,215,.55);
    margin:14px 0 8px;font-weight:600}
  .mp-sec-title:first-child{margin-top:0}

  .mp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mp-stat{
    padding:11px 12px;border-radius:11px;background:rgba(255,255,255,.04);
    border:1px solid rgba(150,210,235,.08);
  }
  .mp-stat .sv{font-size:19px;font-weight:700;color:#7de3c4;font-variant-numeric:tabular-nums;line-height:1.15}
  .mp-stat .sl{font-size:11px;color:rgba(160,195,215,.65);margin-top:3px}

  .mp-btn{
    width:100%;font:inherit;font-size:13px;font-weight:600;padding:11px;border-radius:10px;
    cursor:pointer;margin-top:8px;
    background:rgba(125,227,196,.15);border:1px solid rgba(125,227,196,.4);color:#7de3c4;
    transition:.15s;
  }
  .mp-btn:hover{background:rgba(125,227,196,.25)}
  .mp-btn:active{transform:scale(.985)}
  .mp-btn.warm{background:rgba(255,215,94,.12);border-color:rgba(255,215,94,.35);color:#ffd75e}
  .mp-btn.warm:hover{background:rgba(255,215,94,.22)}

  .mp-row{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
    background:rgba(255,255,255,.035);border:1px solid rgba(150,210,235,.07);
    margin-bottom:7px;transition:.13s;
  }
  .mp-row:hover{background:rgba(255,255,255,.06)}
  .mp-row .mi{font-size:19px;width:26px;text-align:center;flex-shrink:0}
  .mp-row .minfo{flex:1;min-width:0}
  .mp-row .mn{font-size:12.5px;color:#e0eefa;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mp-row .ms{font-size:11px;color:rgba(160,195,215,.6);margin-top:1px}
  .mp-row .ms.full{color:#ffd75e}
  .mp-mini{
    font:inherit;font-size:11px;padding:6px 11px;border-radius:8px;cursor:pointer;flex-shrink:0;
    background:rgba(125,227,196,.14);border:1px solid rgba(125,227,196,.35);color:#7de3c4;
    transition:.13s;font-weight:600;
  }
  .mp-mini:hover{background:rgba(125,227,196,.26)}
  .mp-mini:disabled{opacity:.35;cursor:not-allowed}
  .mp-mini.danger{background:rgba(255,110,110,.12);border-color:rgba(255,110,110,.32);color:#ff9b9b}
  .mp-mini.danger:hover{background:rgba(255,110,110,.22)}
  .mp-mini.gold{background:rgba(255,215,94,.12);border-color:rgba(255,215,94,.34);color:#ffd75e}
  .mp-mini.gold:hover{background:rgba(255,215,94,.24)}
  .mp-empty{text-align:center;padding:26px 10px;font-size:12px;color:rgba(160,195,215,.45);line-height:1.7}

  /* ---------- 设置弹窗 ---------- */
  #settingsModal{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:rgba(6,12,18,.62);backdrop-filter:blur(5px);
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  #settingsModal.show{opacity:1;pointer-events:auto}
  .sm-box{
    width:min(400px,92vw);border-radius:18px;overflow:hidden;
    background:rgba(18,29,38,.98);border:1px solid rgba(150,210,235,.2);
    box-shadow:0 26px 70px rgba(0,0,0,.65);
    transform:translateY(12px) scale(.97);transition:transform .22s;
  }
  #settingsModal.show .sm-box{transform:translateY(0) scale(1)}
  .sm-head{display:flex;align-items:center;justify-content:space-between;
    padding:15px 18px 12px;font-size:15px;font-weight:700;color:#e6f3fb;
    border-bottom:1px solid rgba(150,210,235,.1)}
  .sm-head .sm-close{cursor:pointer;font-size:17px;color:rgba(180,210,228,.6);
    padding:2px 6px;border-radius:7px;transition:.15s}
  .sm-head .sm-close:hover{color:#ff8a8a;background:rgba(255,120,120,.1)}
  .sm-body{padding:14px 18px 6px}
  .sm-row{margin-bottom:16px}
  .sm-label{font-size:12.5px;color:#cfe4f0;margin-bottom:7px;font-weight:600;
    display:flex;justify-content:space-between;align-items:center}
  .sm-label em{font-style:normal;font-size:10.5px;color:rgba(160,195,215,.55);font-weight:400}
  .sm-label .sm-val{color:#7de3c4;font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;
    background:rgba(255,255,255,.11);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;
    background:#7de3c4;border:2px solid #102028;cursor:pointer;
    box-shadow:0 0 0 3px rgba(125,227,196,.18);transition:.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 5px rgba(125,227,196,.26)}
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:#7de3c4;border:2px solid #102028;cursor:pointer;
  }
  .sm-foot{display:flex;gap:8px;padding:8px 18px 18px}
  .sm-foot button{
    flex:1;font:inherit;font-size:13px;font-weight:600;padding:11px;border-radius:10px;cursor:pointer;
    transition:.15s;
  }
  .btn-ghost{background:rgba(255,110,110,.1);border:1px solid rgba(255,110,110,.3);color:#ff9b9b}
  .btn-ghost:hover{background:rgba(255,110,110,.2)}
  .btn-primary{background:rgba(125,227,196,.16);border:1px solid rgba(125,227,196,.42);color:#7de3c4}
  .btn-primary:hover{background:rgba(125,227,196,.26)}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;top:20%;transform:translate(-50%,8px);
    padding:10px 22px;border-radius:11px;font-size:13.5px;font-weight:600;
    background:rgba(18,29,38,.94);color:#7de3c4;
    border:1px solid rgba(125,227,196,.35);
    opacity:0;pointer-events:none;transition:.28s;z-index:60;
    box-shadow:0 8px 26px rgba(0,0,0,.4);max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.err{color:#ff9b9b;border-color:rgba(255,120,120,.4)}

  /* ---------- 全局错误提示 ---------- */
  #errBanner{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
    padding:10px 18px;border-radius:10px;font-size:12px;font-family:monospace;
    background:rgba(180,30,30,.95);color:#fff;z-index:9999;
    max-width:92vw;display:none;box-shadow:0 6px 22px rgba(0,0,0,.5);
    line-height:1.5;
  }

  @media (max-width:520px){
    .res{font-size:12px;padding:3px 7px;gap:3px}
    .res .ic{font-size:13px}
    #buildMenu{width:min(268px,92vw)}
    #tip{font-size:11.5px;padding:7px 14px}
    .tbtn{width:40px;height:40px;font-size:17px}
    #sideBtns{bottom:70px;right:10px;gap:6px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="res" id="resGold"><span class="ic">💰</span><span>0</span></div>
  <div class="res" id="resWheat"><span class="ic">🌾</span><span>0</span></div>
  <div class="res" id="resWood"><span class="ic">🪵</span><span>0</span></div>
  <div class="res" id="resPop"><span class="ic">👥</span><span>0/2</span></div>
  <div class="res" id="resHappy"><span class="ic">😊</span><span>0</span></div>
</div>

<div id="sideBtns">
  <button class="tbtn" id="btnManage" title="小镇管理">📋<span class="dot" id="volDot"></span></button>
  <button class="tbtn" id="btnSettings" title="设置">⚙️</button>
  <button class="tbtn" id="btnSave" title="保存">💾</button>
</div>

<div id="tip">点击 <b>空地</b> 建造 · 点击 <b>建筑</b> 收获 · 点击 <b>居民</b> 打招呼</div>

<!-- 建造菜单 -->
<div id="buildMenu">
  <div class="bm-head"><span>建造建筑</span><span class="bm-close">✕</span></div>
  <div id="bmList"></div>
</div>

<!-- 管理面板 -->
<div id="managePanel">
  <div class="mp-head"><span>🏘️ 小镇管理</span><span class="mp-close">✕</span></div>
  <div class="mp-tabs">
    <button data-tab="overview" class="active">概览</button>
    <button data-tab="buildings">建筑</button>
    <button data-tab="volunteers">志愿者</button>
  </div>
  <div id="mpBody"></div>
</div>

<!-- 设置 -->
<div id="settingsModal">
  <div class="sm-box">
    <div class="sm-head"><span>⚙️ 游戏设置</span><span class="sm-close">✕</span></div>
    <div class="sm-body">
      <div class="sm-row">
        <div class="sm-label">初始金币 <em>（重置小镇后生效）</em><span class="sm-val" id="vStartGold">320</span></div>
        <input type="range" id="setStartGold" min="100" max="3000" step="50" value="320">
      </div>
      <div class="sm-row">
        <div class="sm-label">建造成本倍率<span class="sm-val" id="vCostMult">1.0x</span></div>
        <input type="range" id="setCostMult" min="0.5" max="2" step="0.1" value="1">
      </div>
      <div class="sm-row">
        <div class="sm-label">产出速度倍率<span class="sm-val" id="vProdMult">1.0x</span></div>
        <input type="range" id="setProdMult" min="0.5" max="3" step="0.1" value="1">
      </div>
      <div class="sm-row">
        <div class="sm-label">居民 / 志愿者速度<span class="sm-val" id="vNpcMult">1.0x</span></div>
        <input type="range" id="setNpcMult" min="0.5" max="2.5" step="0.1" value="1">
      </div>
    </div>
    <div class="sm-foot">
      <button class="btn-ghost" id="btnResetTown">🗑️ 重置小镇</button>
      <button class="btn-primary" id="btnApplySettings">保存设置</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="errBanner"></div>

<script>
(function () {
'use strict';

/* ============================================================
   0. 全局错误提示（方便定位问题）
   ============================================================ */
const errBanner = document.getElementById('errBanner');
let errHideTimer = 0;
window.addEventListener('error', function (e) {
  if (!errBanner) return;
  errBanner.textContent = '⚠ 错误: ' + (e.message || '未知错误');
  errBanner.style.display = 'block';
  clearTimeout(errHideTimer);
  errHideTimer = setTimeout(function () { errBanner.style.display = 'none'; }, 7000);
});

/* ============================================================
   1. 基础常量
   ============================================================ */
const COLS = 18, ROWS = 12, TILE = 64;
const MAP_W = COLS * TILE, MAP_H = ROWS * TILE;

const SAVE_KEY = 'littleTownSave_v2';
const SETTINGS_KEY = 'littleTownSettings_v2';

const canvas = document.getElementById('game');
const ctx = canvas ? canvas.getContext('2d') : null;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* ---------- 音效 ---------- */
let actx = null;
function sfx(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 0.72, actx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  } catch (e) {}
}

/* ============================================================
   2. 设置系统（安全 localStorage）
   ============================================================ */
const DEFAULT_SETTINGS = {
  startGold: 320,
  costMult: 1.0,
  prodSpeedMult: 1.0,
  npcSpeedMult: 1.0
};
let settings = Object.assign({}, DEFAULT_SETTINGS);

function safeGetItem(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function safeSetItem(key, val) {
  try { localStorage.setItem(key, val); return true; } catch (e) { return false; }
}

function loadSettings() {
  try {
    const s = JSON.parse(safeGetItem(SETTINGS_KEY) || 'null');
    if (s && typeof s === 'object') {
      settings = Object.assign({}, DEFAULT_SETTINGS, s);
    }
  } catch (e) {}
}
function persistSettings() {
  safeSetItem(SETTINGS_KEY, JSON.stringify(settings));
}
loadSettings();

/* ============================================================
   3. 建筑定义
   ============================================================ */
const BTYPES = {
  farm: {
    name: '麦田', icon: '🌾', desc: '缓慢产出小麦',
    cost: { gold: 50 },
    prod: { item: 'wheat', amount: 1, interval: 6, cap: 4 },
    color: '#c8b060'
  },
  lumber: {
    name: '伐木场', icon: '🪵', desc: '砍伐树木产出木材',
    cost: { gold: 70 },
    prod: { item: 'wood', amount: 1, interval: 6, cap: 4 },
    color: '#8a6a3e'
  },
  bakery: {
    name: '面包坊', icon: '🍞', desc: '消耗小麦，烤出金币',
    cost: { gold: 150, wood: 10 },
    cons: { item: 'wheat', amount: 1 },
    prod: { item: 'gold', amount: 16, interval: 5.5, cap: 48 },
    color: '#e0a050'
  },
  shop: {
    name: '杂货铺', icon: '🏪', desc: '居民会进来消费',
    cost: { gold: 200, wood: 15 },
    prod: { item: 'gold', amount: 11, interval: 5, cap: 44 },
    color: '#4a9ec9'
  },
  house: {
    name: '民居', icon: '🏠', desc: '吸引新居民入住',
    cost: { gold: 120, wood: 20 },
    prod: null, pop: 2,
    color: '#c95a4a'
  },
  fountain: {
    name: '喷泉', icon: '⛲', desc: '提升全镇幸福度',
    cost: { gold: 180, wood: 10 },
    prod: null, happy: 1,
    color: '#5ac9c9'
  }
};
const BUILD_ORDER = ['farm', 'lumber', 'bakery', 'shop', 'house', 'fountain'];

function buildingCost(type) {
  const c = BTYPES[type].cost;
  const out = {};
  for (const k in c) out[k] = Math.max(1, Math.round(c[k] * settings.costMult));
  return out;
}

const resources = { gold: 320, wheat: 0, wood: 0 };
